<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Offline | CrewOne</title>
<style>
  :root{--brand:#4f46e5;--ink:#1c2233;--mute:#525f7a;--bg:#f5f6fa;--card:#fff;--line:#e4e7ef}
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:40px 32px;max-width:380px;width:100%}
  .icon{width:64px;height:64px;margin:0 auto 20px;color:var(--brand);opacity:.7}
  h1{font-size:20px;font-weight:700;margin:0 0 10px}
  p{font-size:14px;color:var(--mute);line-height:1.6;margin:0 0 24px}
  .btn{display:inline-block;background:var(--brand);color:#fff;border:none;border-radius:8px;padding:10px 24px;font-size:14px;font-weight:600;cursor:pointer;text-decoration:none}
  .btn:hover{background:#4338ca}
  .status{font-size:12px;color:var(--mute);margin-top:16px}
  @media(prefers-color-scheme:dark){:root{--bg:#0f172a;--card:#1e293b;--ink:#f1f5f9;--mute:#94a3b8;--line:#334155}}
</style>
</head>
<body>
<div class="card">
  <svg class="icon" viewBox="0 0 64 64" fill="none">
    <circle cx="32" cy="32" r="28" stroke="currentColor" stroke-width="2.5"/>
    <path d="M20 32h24M20 24h8M20 40h8" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M44 20l-8 8 8 8" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
  <h1>You're offline</h1>
  <p>CrewOne needs an internet connection to load HR data. Please check your connection and try again.</p>
  <button class="btn" onclick="location.reload()">Try again</button>
  <p class="status" id="st"></p>
</div>
<script>
  window.addEventListener("online", function() {
    document.getElementById("st").textContent = "Connection restored — reloading…";
    setTimeout(function(){ location.reload(); }, 800);
  });
  window.addEventListener("offline", function() {
    document.getElementById("st").textContent = "Still offline.";
  });
</script>
</body>
</html>
